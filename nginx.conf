server {
    listen 80;
    server_name cruise.ap-travel.ru www.cruise.ap-travel.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cruise.ap-travel.ru www.cruise.ap-travel.ru;

    gzip on;
    gzip_proxied any;
    gzip_types application/javascript application/x-javascript text/css text/javascript;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_min_length 256;

    # Обработка запросов к папке /uploads/
    location /uploads/ships/ {
        alias /var/www/cruises/uploads/ships/;
        access_log off;
        expires 30d;
    }

    # Обработка запросов к статическим файлам Next.js
    location /_next/static/ {
        alias /var/www/cruises/.next/static/;
        expires 365d;
        access_log off;
    }

    # Проксирование всех остальных запросов на Next.js приложение
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
